<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BtP Oven — page layouts</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px; background: #0a0b0d; color: #e9e3d2;
         font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: 18px; letter-spacing: .08em; text-transform: uppercase; color: #b6ff2e; margin: 0 0 4px; }
  p  { color: #8b8f97; margin: 0 0 20px; font-size: 12px; }
  figure { margin: 0 0 28px; }
  figcaption { font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
               color: #8b8f97; margin-bottom: 8px; }
  img { width: 100%; height: auto; display: block; border: 1px solid #2e3137; border-radius: 8px; }
</style>
</head>
<body>
  <h1>BtP Oven — page layouts</h1>
  <p>Captured directly from the plugin at design resolution (1180 × 800).</p>

  <figure><figcaption>Main</figcaption><img src="page-main.png" alt="Main page"></figure>
  <figure><figcaption>Vocal Chain</figcaption><img src="page-vox.png" alt="Vocal chain page"></figure>
  <figure><figcaption>Master Chain</figcaption><img src="page-master.png" alt="Master chain page"></figure>
  <figure><figcaption>Chain Rack</figcaption><img src="page-stack.png" alt="Rack page"></figure>
</body>
</html>
